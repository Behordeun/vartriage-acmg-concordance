[project]
name = "vartriage-acmg-concordance"
version = "0.1.0"
description = "Reproducible analysis: concordance of automated ACMG classification with expert-curated assertions"
requires-python = ">=3.11"
authors = [
    { name = "Muhammad Abiodun SULAIMAN", email = "abiodun.msulaiman@gmail.com" },
    { name = "Bolaji Fatai OYEYEMI", email = "bolajioyeyemi@gmail.com" },
]
dependencies = [
    "vartriage[api] @ file:///Users/muhammad/Documents/DevProjects/personal_projects/Bioinformatics_Libraries/vartriage",
    "numpy>=1.24.0,<3.0",
    "pandas>=2.0.0,<3.0",
    "matplotlib>=3.8.0,<4.0",
    "seaborn>=0.13.0,<1.0",
    "scikit-learn>=1.3.0,<2.0",
    "scipy>=1.11.0,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analysis"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ipython>=8.0",
]
